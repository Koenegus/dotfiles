set -g mouse on
set -g set-clipboard on

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

bind = split-window -h
bind - split-window -v
unbind '"'
unbind %

unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 0

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
unbind -T copy-mode-vi MouseDragEnd1Pane
set -g set-clipboard on

set-option -g allow-rename off

set -g status-style bg="#b22222",fg=white
set -g pane-border-style fg=#F3FF8A
set -g pane-active-border-style fg=#F3FF8A
set -g message-style bg="#b22222",fg=white
set -g message-command-style bg="#b22222",fg=white
set -g window-status-current-style bg="#b22222",fg=white
set -g mode-style bg="#b22222",fg=white
set -g status-left-style bg="#b22222",fg=white
set -g status-right-style bg="#b22222",fg=white
set -g window-status-activity-style  bg="#b22222",fg=white
