backend = "xrender"
vsync = true;
xrender-sync-fence = true;
use-damage = false;
log-level = "warn";
dbus = true;

#shadows
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.5;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-ignore-shaped = true;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'librewolf'",
  "class_g = 'Chromium-browser'",
  "class_g = 'tor-browser'",
  "class_g = 'Tint2'",
  "name *= 'picom'",
  "class_g = 'Plank'",
  "class_g = 'dzen'",
  "_GTK_FRAME_EXTENTS",
  "class_g = 'org.nicotine_plus.Nicotine'",
  "class_g = 'Image Lounge'",
  "class_g = 'dwm'",
#  "class_g = 'wpa_gui'",
#  "class_g = 'ZapFast'",
#  "class_g = 'transgui'",
#  "class_g = 'qBittorrent'",
];

corner-radius = 5;
rounded-corners-exclude = [
  "class_g = 'Tint2'",
  "class_g = 'Plank'",
  "class_g = 'dzen'",
  "class_g = 'dwm'",
  "class_g = 'wpa_gui'"
];

#fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;
no-fading-openclose = true;
no-fading-destroyed-argb = true;

wintypes:
{
    menu = {
        opacity = 0.90;
    };

    dropdown_menu = {
        opacity = 0.90;
    };

    popup_menu = {
        opacity = 0.90;
    };
    dock = {
        opacity = 0.85;
    }
};

#Remember: xprop !!!
frame-opacity = 0.9;
opacity-rule = [
    "75:class_g = 'dzen'",
	"85:class_g = 'dwm'",
    "95:class_g = 'Tint2'",
	"85:class_g = 'openbox-menu'",
	"95:class_g = 'Leafpad'",
	"90:class_g = 'Geany'",
	"95:class_g = 'TelegramDesktop'",
	"75:class_g = 'st-256color'",
	"75:class_g = 'XTerm'",
	"95:class_g = 'qBittorrent'",
	"90:class_g = 'XCalendar'",
	"90:class_g = 'wpa_gui'",
    "95:class_g = 'Thunar'"
];
